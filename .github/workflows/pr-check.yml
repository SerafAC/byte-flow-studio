name: PR Check

on:
  pull_request:

jobs:
  test-and-build:
    name: Test & Build (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect project files
        id: detect
        run: |
          echo "has_go=$(test -f go.mod && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_frontend=$(test -f frontend/pnpm-lock.yaml && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Set up Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Node.js
        if: steps.detect.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        if: steps.detect.outputs.has_frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        if: steps.detect.outputs.has_frontend == 'true'
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        if: steps.detect.outputs.has_frontend == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install Linux build dependencies
        if: steps.detect.outputs.has_go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        if: steps.detect.outputs.has_go == 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Go dependencies
        if: steps.detect.outputs.has_go == 'true'
        run: go mod download

      - name: Install frontend dependencies
        if: steps.detect.outputs.has_frontend == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Go tests
        if: steps.detect.outputs.has_go == 'true'
        run: go test -v -race ./...

      - name: Run frontend tests
        if: steps.detect.outputs.has_frontend == 'true'
        working-directory: frontend
        run: pnpm test --run

      - name: Build for Linux
        if: steps.detect.outputs.has_go == 'true'
        run: wails3 build
        env:
          GOOS: linux
          GOARCH: amd64
