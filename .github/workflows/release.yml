name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Calculate next version, generate changelog, commit & tag
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(grep '  version:' build/config.yml | head -1 | sed 's/.*version: *"\([^"]*\)".*/\1/')
          echo "Current version: ${CURRENT}"
          IFS='.' read -ra PARTS <<< "$CURRENT"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog since ${PREV_TAG}"
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          else
            echo "No previous tag found — including last 50 commits"
            CHANGES=$(git log --pretty=format:"- %s (%h)" | head -50)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- Initial release"
          fi
          # Use random EOF marker to safely handle multiline content
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "changelog<<${EOF_MARKER}"
            echo "$CHANGES"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"

      - name: Update version in build/config.yml
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          sed -i "s/  version: \"[^\"]*\"/  version: \"${VERSION}\"/" build/config.yml
          grep 'version:' build/config.yml | head -2

      - name: Update version in frontend/package.json
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" frontend/package.json
          grep '"version"' frontend/package.json

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/config.yml frontend/package.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build binaries for Linux and Windows (parallel matrix)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
            binary: ByteFlowStudio
            artifact: byteflow-studio-linux-amd64

          - name: Windows
            goos: windows
            goarch: amd64
            # CGO_ENABLED=0 enables pure-Go cross-compilation without a Windows
            # C toolchain. All deps (modernc/sqlite, go.bug.st/serial, Wails)
            # support CGO-free builds on Windows.
            cgo_enabled: "0"
            binary: ByteFlowStudio.exe
            artifact: byteflow-studio-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install Linux system dependencies
        # Required for CGO (Linux binary) and Wails WebKit bindings.
        # Also present for the Windows cross-compile job — gcc is only invoked
        # when CGO_ENABLED=1 and GOOS=linux, so it is safely ignored otherwise.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        run: wails3 build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "bin/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Create the GitHub release and attach both binaries
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-22.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "ByteFlow Studio ${{ needs.prepare.outputs.tag }}"
          body: |
            ## What's Changed

            ${{ needs.prepare.outputs.changelog }}

            ---

            ## Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux    | x86_64      | `byteflow-studio-linux-amd64` |
            | Windows  | x86_64      | `byteflow-studio-windows-amd64.exe` |
          files: artifacts/*
          draft: false
          prerelease: false
